spring.application.name=travel-agent
server.port=8080

management.endpoints.web.exposure.include=health,info
# Error responses as RFC 9457 problem details, so the UI can show the "detail" message
spring.mvc.problemdetails.enabled=true

# OpenAI: the key is read from the OPENAI_API_KEY environment variable (never commit it)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}

# Conversation memory: evict least-recently-used beyond the cap, forget idle conversations
travel-agent.chat-memory.max-conversations=10000
travel-agent.chat-memory.idle-timeout=2h

# Chat advisors (see ChatClientConfig)
# Hard deadline for the model call (TimeoutAdvisor). Spring AI 2.0.1's spring.ai.openai.*timeout
# properties were observed not to limit chat calls, so the deadline is enforced here instead.
travel-agent.advisors.chat-timeout=60s
travel-agent.advisors.pii-redaction.enabled=true
travel-agent.advisors.moderation.enabled=true
# If the moderation API is down: true = let requests through, false = reject them
travel-agent.advisors.moderation.fail-open=true
# Longest a request waits for the moderation verdict before applying fail-open/fail-closed
travel-agent.advisors.moderation.timeout=3s
# Set to DEBUG to log full prompts and responses (SimpleLoggerAdvisor); keep off in production
logging.level.org.springframework.ai.chat.client.advisor=INFO
